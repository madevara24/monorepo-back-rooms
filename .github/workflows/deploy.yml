name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_router:
        description: >-
          Also deploy the connection router (the :5432 data path). This
          is a separate Dokploy app from mbr-api/mbr-web specifically
          so it is never touched by a push-to-main deploy; leave this
          unchecked unless you are deliberately cutting the data path
          over (see the runbook in connection-router/README.md).
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOST: ${{ secrets.VPS_KNOWN_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOST" > ~/.ssh/known_hosts

      - name: Trigger Dokploy deploy
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DOKPLOY_KEY: ${{ secrets.DOKPLOY_KEY }}
          DOKPLOY_MBR_COMPOSE_ID: ${{ secrets.DOKPLOY_MBR_COMPOSE_ID }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts "$VPS_USER@$VPS_HOST" bash -s <<SCRIPT
          curl -fsS -X POST http://localhost:3000/api/compose.deploy \
            -H "x-api-key: $DOKPLOY_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\":\"$DOKPLOY_MBR_COMPOSE_ID\"}"
          SCRIPT

      - name: Wait for the live commit to match
        run: |
          last_seen=""
          deadline=$((SECONDS + 300))
          until [ "$SECONDS" -ge "$deadline" ]; do
            last_seen=$(curl -fsS https://mbr.madevara.com/healthz 2>/dev/null | jq -r '.commit // empty')
            if [ "$last_seen" = "$GITHUB_SHA" ]; then
              echo "healthz reports $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "timed out after 300s waiting for /healthz to report $GITHUB_SHA (last seen commit: '$last_seen')" >&2
          exit 1

  # deploy-router is deliberately workflow_dispatch-only, gated behind
  # its own input: the router is the live :5432 data path once cut
  # over (see the runbook in connection-router/README.md), and a
  # routine push-to-main deploy of mbr-api/mbr-web must never restart
  # it. mbr-router's GET /healthz is published to host loopback only
  # (not through Traefik), so it's polled over SSH, not a public URL.
  deploy-router:
    name: Deploy router
    needs: gate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_router
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOST: ${{ secrets.VPS_KNOWN_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOST" > ~/.ssh/known_hosts

      - name: Trigger Dokploy deploy (router)
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DOKPLOY_KEY: ${{ secrets.DOKPLOY_KEY }}
          DOKPLOY_MBR_ROUTER_COMPOSE_ID: ${{ secrets.DOKPLOY_MBR_ROUTER_COMPOSE_ID }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts "$VPS_USER@$VPS_HOST" bash -s <<SCRIPT
          curl -fsS -X POST http://localhost:3000/api/compose.deploy \
            -H "x-api-key: $DOKPLOY_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\":\"$DOKPLOY_MBR_ROUTER_COMPOSE_ID\"}"
          SCRIPT

      - name: Wait for the router's /healthz to report the deployed commit
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts "$VPS_USER@$VPS_HOST" bash -s <<SCRIPT
          last_seen=""
          deadline=\$((SECONDS + 300))
          until [ "\$SECONDS" -ge "\$deadline" ]; do
            last_seen=\$(curl -fsS http://127.0.0.1:9099/healthz 2>/dev/null | jq -r '.commit // empty')
            if [ "\$last_seen" = "$GITHUB_SHA" ]; then
              echo "router /healthz reports $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "timed out after 300s waiting for router /healthz to report $GITHUB_SHA (last seen commit: '\$last_seen')" >&2
          exit 1
          SCRIPT
