name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    uses: ./.github/workflows/ci.yml

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      control: ${{ steps.force.outputs.control || steps.filter.outputs.control }}
      router: ${{ steps.force.outputs.router || steps.filter.outputs.router }}
      node: ${{ steps.force.outputs.node || steps.filter.outputs.node }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force every stack on manual dispatch
        id: force
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "control=true" >> "$GITHUB_OUTPUT"
          echo "router=true" >> "$GITHUB_OUTPUT"
          echo "node=true" >> "$GITHUB_OUTPUT"

      - name: Paths filter
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            control:
              - 'control-panel-service/**'
              - 'control-web/**'
              - 'dokploy-compose.yml'
              - '.github/workflows/deploy.yml'
            router:
              - 'connection-router/**'
              - 'dokploy-compose.router.yml'
              - '.github/workflows/deploy.yml'
            node:
              - 'node-agent-service/**'
              - 'agent-release/**'
              - '.github/workflows/deploy.yml'

  deploy:
    name: Deploy
    needs: [gate, changes]
    if: needs.changes.outputs.control == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOST: ${{ secrets.VPS_KNOWN_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOST" > ~/.ssh/known_hosts

      - name: Trigger Dokploy deploy
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DOKPLOY_KEY: ${{ secrets.DOKPLOY_KEY }}
          DOKPLOY_MBR_COMPOSE_ID: ${{ secrets.DOKPLOY_MBR_COMPOSE_ID }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts "$VPS_USER@$VPS_HOST" bash -s <<SCRIPT
          curl -fsS -X POST http://localhost:3000/api/compose.deploy \
            -H "x-api-key: $DOKPLOY_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\":\"$DOKPLOY_MBR_COMPOSE_ID\"}"
          SCRIPT

      - name: Wait for the live commit to match
        run: |
          last_seen=""
          deadline=$((SECONDS + 300))
          until [ "$SECONDS" -ge "$deadline" ]; do
            last_seen=$(curl -fsS https://mbr.madevara.com/healthz 2>/dev/null | jq -r '.commit // empty')
            if [ "$last_seen" = "$GITHUB_SHA" ]; then
              echo "healthz reports $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "timed out after 300s waiting for /healthz to report $GITHUB_SHA (last seen commit: '$last_seen')" >&2
          exit 1

  # mbr-router has no Dokploy app: it's a single container run directly
  # over SSH, built on the runner and shipped as a docker save|gzip
  # stream, so a routine control-plane deploy (the `deploy` job above)
  # never touches it. mbr-router's GET /healthz is published to host
  # loopback only (not through Traefik), so it's polled over SSH, not a
  # public URL. See connection-router/README.md for the migration and
  # rollback runbook.
  deploy-router:
    name: Deploy router
    needs: [gate, changes]
    if: needs.changes.outputs.router == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOST: ${{ secrets.VPS_KNOWN_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOST" > ~/.ssh/known_hosts

      - name: Build the router image
        run: |
          docker build -f connection-router/Dockerfile \
            --build-arg COMMIT_SHA="$GITHUB_SHA" \
            -t "mbr-router:$GITHUB_SHA" .

      - name: Ship the image to the VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          docker save "mbr-router:$GITHUB_SHA" | gzip | \
            ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts "$VPS_USER@$VPS_HOST" 'docker load'

      - name: Run the new container
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts "$VPS_USER@$VPS_HOST" bash -s <<SCRIPT
          docker rm -f mbr-router || true
          docker run -d --name mbr-router --restart unless-stopped \
            -p 5432:15432 \
            -p 127.0.0.1:9099:9099 \
            -v /etc/mbr/routes:/etc/mbr/routes:ro \
            mbr-router:$GITHUB_SHA
          SCRIPT

      - name: Wait for the router's /healthz to report the deployed commit
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts "$VPS_USER@$VPS_HOST" bash -s <<SCRIPT
          last_seen=""
          deadline=\$((SECONDS + 300))
          until [ "\$SECONDS" -ge "\$deadline" ]; do
            last_seen=\$(curl -fsS http://127.0.0.1:9099/healthz 2>/dev/null | jq -r '.commit // empty')
            if [ "\$last_seen" = "$GITHUB_SHA" ]; then
              echo "router /healthz reports $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "timed out after 300s waiting for router /healthz to report $GITHUB_SHA (last seen commit: '\$last_seen')" >&2
          exit 1
          SCRIPT

  # mbr-node has no Dokploy app and nothing on the data VPS pulls from
  # this job automatically: it only builds, signs, and publishes the
  # release. Installing a published release onto a data VPS is still a
  # manual step until MBR-23's updater exists (see DEPLOY.md).
  release-node:
    name: Release node-agent-service
    needs: [gate, changes]
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Require the release signing key
        env:
          SIGNING_KEY: ${{ secrets.MBR_NODE_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::MBR_NODE_RELEASE_SIGNING_KEY repo secret is not set. This is the ed25519 private key CI signs mbr-node releases with. Generate one with 'go run ./agent-release/cmd/genkey', add the printed private key as this repo secret, and configure the printed public key as MBR_RELEASE_PUBLIC_KEY_B64 (control plane) and AGENT_RELEASE_PUBLIC_KEY_B64 (every node-agent-service host). Not generating one here: an ad-hoc key minted by this job would not be the key ops actually trust." >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: node-agent-service/go.mod

      - name: Build mbr-node
        run: |
          mkdir -p dist
          go build -C node-agent-service -trimpath -ldflags "-X main.commit=$GITHUB_SHA" -o "$GITHUB_WORKSPACE/dist/mbr-node" ./cmd/node

      - name: Sign the release
        id: sign
        env:
          MBR_NODE_RELEASE_SIGNING_KEY: ${{ secrets.MBR_NODE_RELEASE_SIGNING_KEY }}
        run: |
          version="$GITHUB_RUN_NUMBER"
          tag="mbr-node-v${version}"
          # The download URL is deterministic from the repo, tag, and
          # asset name alone, so it's known *before* the GitHub release
          # exists and can be signed along with version/commit/checksum.
          # That closes a race: manifest.json is a public release asset,
          # so without this, anyone who read a signed manifest could
          # race CI's own registration call with the same valid
          # signature but a different artifact_url.
          artifact_url="https://github.com/$GITHUB_REPOSITORY/releases/download/${tag}/mbr-node"
          go run ./agent-release/cmd/sign \
            -binary dist/mbr-node \
            -version "$version" \
            -commit "$GITHUB_SHA" \
            -artifact-url "$artifact_url" \
            -out dist/manifest.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: a prior run of this same workflow run (same
          # GITHUB_RUN_NUMBER, so the same tag) may have created the
          # release and then failed at a later step (e.g. the control
          # plane was unreachable). Re-running must not die on "tag
          # already exists" — it should pick up where it left off.
          if gh release view "${{ steps.sign.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release ${{ steps.sign.outputs.tag }} already exists; reusing it (resuming after a prior partial failure)"
          else
            gh release create "${{ steps.sign.outputs.tag }}" \
              dist/mbr-node dist/manifest.json \
              --title "mbr-node v${{ steps.sign.outputs.version }}" \
              --notes "Commit $GITHUB_SHA" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Register the release with the control plane
        run: |
          status=$(curl -sS -o /tmp/register-response.json -w "%{http_code}" -X POST https://mbr.madevara.com/api/releases \
            -H "Content-Type: application/json" \
            --data-binary @dist/manifest.json)
          cat /tmp/register-response.json
          echo
          if [ "$status" = "201" ]; then
            echo "registered release ${{ steps.sign.outputs.version }}"
          elif [ "$status" = "409" ]; then
            # A prior run of this same workflow run already registered
            # it (e.g. this step reports success here but the runner
            # was killed before recording it) — same idempotency case
            # as the publish step above, not a real conflict, since the
            # version/signature pair is unique to this run.
            echo "release ${{ steps.sign.outputs.version }} was already registered; treating as success"
          else
            echo "::error::registering release ${{ steps.sign.outputs.version }} failed with HTTP $status"
            exit 1
          fi
