name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    uses: ./.github/workflows/ci.yml

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      control: ${{ steps.force.outputs.control || steps.filter.outputs.control }}
      router: ${{ steps.force.outputs.router || steps.filter.outputs.router }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force both stacks on manual dispatch
        id: force
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "control=true" >> "$GITHUB_OUTPUT"
          echo "router=true" >> "$GITHUB_OUTPUT"

      - name: Paths filter
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            control:
              - 'control-panel-service/**'
              - 'control-web/**'
              - 'dokploy-compose.yml'
              - '.github/workflows/deploy.yml'
            router:
              - 'connection-router/**'
              - 'dokploy-compose.router.yml'
              - '.github/workflows/deploy.yml'

  deploy:
    name: Deploy
    needs: [gate, changes]
    if: needs.changes.outputs.control == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOST: ${{ secrets.VPS_KNOWN_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOST" > ~/.ssh/known_hosts

      - name: Trigger Dokploy deploy
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DOKPLOY_KEY: ${{ secrets.DOKPLOY_KEY }}
          DOKPLOY_MBR_COMPOSE_ID: ${{ secrets.DOKPLOY_MBR_COMPOSE_ID }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts "$VPS_USER@$VPS_HOST" bash -s <<SCRIPT
          curl -fsS -X POST http://localhost:3000/api/compose.deploy \
            -H "x-api-key: $DOKPLOY_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\":\"$DOKPLOY_MBR_COMPOSE_ID\"}"
          SCRIPT

      - name: Wait for the live commit to match
        run: |
          last_seen=""
          deadline=$((SECONDS + 300))
          until [ "$SECONDS" -ge "$deadline" ]; do
            last_seen=$(curl -fsS https://mbr.madevara.com/healthz 2>/dev/null | jq -r '.commit // empty')
            if [ "$last_seen" = "$GITHUB_SHA" ]; then
              echo "healthz reports $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "timed out after 300s waiting for /healthz to report $GITHUB_SHA (last seen commit: '$last_seen')" >&2
          exit 1

  # mbr-router has no Dokploy app: it's a single container run directly
  # over SSH, built on the runner and shipped as a docker save|gzip
  # stream, so a routine control-plane deploy (the `deploy` job above)
  # never touches it. mbr-router's GET /healthz is published to host
  # loopback only (not through Traefik), so it's polled over SSH, not a
  # public URL. See connection-router/README.md for the migration and
  # rollback runbook.
  deploy-router:
    name: Deploy router
    needs: [gate, changes]
    if: needs.changes.outputs.router == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOST: ${{ secrets.VPS_KNOWN_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOST" > ~/.ssh/known_hosts

      - name: Build the router image
        run: |
          docker build -f connection-router/Dockerfile \
            --build-arg COMMIT_SHA="$GITHUB_SHA" \
            -t "mbr-router:$GITHUB_SHA" .

      - name: Ship the image to the VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          docker save "mbr-router:$GITHUB_SHA" | gzip | \
            ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts "$VPS_USER@$VPS_HOST" 'docker load'

      - name: Run the new container
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts "$VPS_USER@$VPS_HOST" bash -s <<SCRIPT
          docker rm -f mbr-router || true
          docker run -d --name mbr-router --restart unless-stopped \
            --log-opt max-size=10m --log-opt max-file=3 \
            -p 5432:15432 \
            -p 127.0.0.1:9099:9099 \
            -v /etc/mbr/routes:/etc/mbr/routes:ro \
            mbr-router:$GITHUB_SHA
          SCRIPT

      - name: Wait for the router's /healthz to report the deployed commit
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts "$VPS_USER@$VPS_HOST" bash -s <<SCRIPT
          last_seen=""
          deadline=\$((SECONDS + 300))
          until [ "\$SECONDS" -ge "\$deadline" ]; do
            last_seen=\$(curl -fsS http://127.0.0.1:9099/healthz 2>/dev/null | jq -r '.commit // empty')
            if [ "\$last_seen" = "$GITHUB_SHA" ]; then
              echo "router /healthz reports $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "timed out after 300s waiting for router /healthz to report $GITHUB_SHA (last seen commit: '\$last_seen')" >&2
          exit 1
          SCRIPT
