name: Deploy

on:
  workflow_dispatch: {}

jobs:
  gate:
    name: Gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOST: ${{ secrets.VPS_KNOWN_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOST" > ~/.ssh/known_hosts

      - name: Trigger Dokploy deploy
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DOKPLOY_KEY: ${{ secrets.DOKPLOY_KEY }}
          DOKPLOY_MBR_COMPOSE_ID: ${{ secrets.DOKPLOY_MBR_COMPOSE_ID }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" \
            "curl -fsS -X POST http://localhost:3000/api/compose.deploy -H 'x-api-key: $DOKPLOY_KEY' -H 'Content-Type: application/json' -d '{\"composeId\":\"$DOKPLOY_MBR_COMPOSE_ID\"}'"

      - name: Wait for the live commit to match
        run: |
          deadline=$((SECONDS + 300))
          until [ "$SECONDS" -ge "$deadline" ]; do
            commit=$(curl -fsS https://mbr.madevara.com/healthz 2>/dev/null | jq -r '.commit // empty')
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "healthz reports $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "timed out after 300s waiting for /healthz to report $GITHUB_SHA" >&2
          exit 1
