name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  deploy-map:
    name: Deploy map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-deploy-stacks.sh

  control-panel-service:
    name: Go (control-panel-service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mbr
          POSTGRES_PASSWORD: mbr
          POSTGRES_DB: mbr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mbr -d mbr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_TEST: postgres://mbr:mbr@localhost:5432/mbr?sslmode=disable
    defaults:
      run:
        working-directory: control-panel-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: control-panel-service/go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: control-panel-service
      - run: go test ./...

  node-agent-service:
    name: Go (node-agent-service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: node-agent-service/go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: node-agent-service
      - run: go test ./...

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
