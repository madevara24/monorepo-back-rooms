services:
  mbr-api:
    build:
      context: .
      dockerfile: control-panel-service/Dockerfile
    restart: unless-stopped
    environment:
      API_ADDR: ":8080"
      API_COOKIE_SECURE: "true"
      DATABASE_URL: ${DATABASE_URL}
      CREDENTIAL_KEY: ${CREDENTIAL_KEY}
      AGENT_CA_B64: ${AGENT_CA_B64}
      AGENT_CLIENT_CERT_B64: ${AGENT_CLIENT_CERT_B64}
      AGENT_CLIENT_KEY_B64: ${AGENT_CLIENT_KEY_B64}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /etc/mbr/routes:/etc/mbr/routes
    depends_on:
      mbr-control-db:
        condition: service_healthy
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.mbr-api.rule=Host(`mbr.madevara.com`) && (PathPrefix(`/api`) || Path(`/healthz`))"
      - "traefik.http.routers.mbr-api.priority=10"
      - "traefik.http.routers.mbr-api.entrypoints=websecure"
      - "traefik.http.routers.mbr-api.tls=true"
      - "traefik.http.services.mbr-api.loadbalancer.server.port=8080"

  mbr-control-panel-web:
    build:
      context: ./control-panel-web
      dockerfile: Dockerfile
      args:
        PUBLIC_DOKPLOY_URL: ${PUBLIC_DOKPLOY_URL}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.mbr-control-panel-web.rule=Host(`mbr.madevara.com`)"
      - "traefik.http.routers.mbr-control-panel-web.priority=1"
      - "traefik.http.routers.mbr-control-panel-web.entrypoints=websecure"
      - "traefik.http.routers.mbr-control-panel-web.tls=true"
      - "traefik.http.services.mbr-control-panel-web.loadbalancer.server.port=80"

  mbr-control-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mbr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mbr
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - mbr-control-db-data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbr -d mbr"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  dokploy-network:
    external: true

volumes:
  mbr-control-db-data:
