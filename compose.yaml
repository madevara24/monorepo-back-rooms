services:
  control-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mbr
      POSTGRES_PASSWORD: mbr
      POSTGRES_DB: mbr
    ports:
      - "5432:5432"
    volumes:
      - control-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbr -d mbr"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  control-db-data:
