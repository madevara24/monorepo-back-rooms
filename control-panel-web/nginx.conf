server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = / {
        try_files /index.html =404;
    }

    location /_app/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri.html =404;
    }
}
